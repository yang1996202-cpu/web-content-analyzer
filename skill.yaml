name: web-content-analyzer
version: 2.0.0
description: 内容预算预检器：分析网页或文本规模，推荐 AI 阅读策略
author: 杨京艺
license: MIT

# Skill 入口点
entry_point: analyze.js

# 需要的工具权限
tools:
  - web_fetch
  - file_write

# 配置项
config:
  # 安全阈值（汉字数）
  safe_threshold: 3000
  warning_threshold: 10000
  
  # 最大分析原始内容长度，避免超大页面拖慢流程
  max_fetch_length: 100000

# 提示词模板
prompts:
  safe: "直接给 AI 链接或粘贴全文"
  warning: "带着明确问题阅读，优先指定章节"
  danger: "先问结构，再按章节、任务或关键词分块处理"
